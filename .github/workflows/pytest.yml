name: Pytest

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to set up'
        required: false
        type: string
        default: '3.x'
      working-directory:
        description: 'Working directory for the pytest run'
        required: false
        type: string
        default: '.'
      requirements-file:
        description: 'Path to requirements file (e.g. requirements.txt or requirements-dev.txt)'
        required: false
        type: string
        default: 'requirements.txt'
      pytest-args:
        description: 'Arguments to pass to pytest'
        required: false
        type: string
        default: '--cov=.'
      coverage-comment:
        description: 'Whether to add a PR comment with coverage results'
        required: false
        type: boolean
        default: true
      enable-uv:
        description: 'Whether to use uv for dependency installation and running pytest'
        required: false
        type: boolean
        default: false
    secrets:
      github-token:
        description: 'GitHub token for adding coverage comments on PRs'
        required: false

permissions:
  contents: read

jobs:
  pytest:
    name: Run Pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ !inputs.enable-uv && 'pip' || '' }}

      - name: Setup uv
        if: ${{ inputs.enable-uv }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
          working-directory: ${{ inputs.working-directory }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
          ENABLE_UV: ${{ inputs.enable-uv }}
        run: |
          if [ "$ENABLE_UV" = "true" ]; then
            if [ -f "uv.lock" ] || [ -f "pyproject.toml" ]; then
              uv sync --all-extras --dev
              if [ -f "$REQUIREMENTS_FILE" ]; then
                uv pip install -r "$REQUIREMENTS_FILE"
              fi
            elif [ -f "$REQUIREMENTS_FILE" ]; then
              uv venv
              uv pip install -r "$REQUIREMENTS_FILE"
            else
              uv venv
            fi
            uv pip install pytest pytest-cov
          else
            python -m pip install --upgrade pip
            if [ -f "$REQUIREMENTS_FILE" ]; then
              pip install -r "$REQUIREMENTS_FILE"
            fi
            pip install pytest pytest-cov
          fi

      - name: Run Pytest
        working-directory: ${{ inputs.working-directory }}
        env:
          PYTEST_ARGS: ${{ inputs.pytest-args }}
          ENABLE_UV: ${{ inputs.enable-uv }}
        run: |
          if [ "$ENABLE_UV" = "true" ]; then
            # shellcheck disable=SC2086
            uv run pytest $PYTEST_ARGS --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml | tee pytest-coverage.txt
          else
            # shellcheck disable=SC2086
            pytest $PYTEST_ARGS --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml | tee pytest-coverage.txt
          fi

      - name: Pytest Coverage Comment
        if: ${{ always() && inputs.coverage-comment == true && github.event_name == 'pull_request' }}
        uses: MishaKav/pytest-coverage-comment@637da55541a2c0e160cbe17c914b92c6a7a3ee67  # main
        with:
          pytest-coverage-path: ${{ inputs.working-directory }}/pytest-coverage.txt
          pytest-xml-coverage-path: ${{ inputs.working-directory }}/coverage.xml
          junitxml-path: ${{ inputs.working-directory }}/pytest.xml
          github-token: ${{ secrets.github-token }}
