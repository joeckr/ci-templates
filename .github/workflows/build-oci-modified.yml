name: Reusable Matrix Container Build for modified Upstream Images

on:
  workflow_call:
    inputs:
      versions-file:
        description: 'Path to versions.json relative to repo root'
        required: false
        type: string
        default: 'versions.json'
      image:
        description: 'Name of the image to build'
        required: true
        type: string
      org:
        description: 'Name of the org/individual to build'
        required: false
        type: string
        default: ${{ github.actor }}
      context:
        description: 'Build context'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile relative to context'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Platforms to build for'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      registry:
        description: 'Container registry to push to'
        required: false
        type: string
        default: 'ghcr.io'
      dry-run:
        description: 'To test if images build on PR but DO NOT push'
        required: false
        type: boolean
        default: false
      enable-trivy:
        description: 'Run Trivy vulnerability scanner'
        required: false
        type: boolean
        default: true
      enable-sbom:
        description: 'Generate and upload an SBOM artifact'
        required: false
        type: boolean
        default: true
      trivy-severity:
        description: 'Vulnerability severities to scan for (comma-separated)'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      trivy-ignore-unfixed:
        description: 'Ignore vulnerabilities without an available fix'
        required: false
        type: boolean
        default: false
      sbom-format:
        description: 'SBOM output format (cyclonedx or spdx-json)'
        required: false
        type: string
        default: 'cyclonedx'

jobs:
  matrix-setup:
    name: Generate Version Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}

      - name: Parse Matrix Config
        id: set-matrix
        run: |
            FILE_NAME=$(echo "${{ inputs.versions-file }}" | tr -d '\r" ' | sed 's|^./||')

            echo "Parsing $FILE_NAME..."

            # Read JSON content directly with jq
            MATRIX_JSON=$(jq -c . "$FILE_NAME")

            if [ -z "$MATRIX_JSON" ]; then
              echo "ERROR: Failed to parse $FILE_NAME or file is empty!"
              exit 1
            fi

            echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: matrix-setup
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Tag
        id: tags
        run: |
          MAJOR="${{ matrix.version.major }}"
          UPSTREAM="${{ matrix.version.upstream }}"
          IS_LATEST="${{ matrix.version.latest }}"
          IS_LTS="${{ matrix.version.lts }}"
          REPO="${{ inputs.registry }}/${{ inputs.org }}/${{ inputs.image }}"

          if [ -z "$MAJOR" ]; then
            echo "ERROR: matrix.version.major is not set"
            exit 1
          fi

          TAG_LIST="${REPO}:${MAJOR},${REPO}:${UPSTREAM}"

          if [ "$IS_LATEST" = "true" ]; then
            TAG_LIST="${TAG_LIST},${REPO}:latest"
          fi

          if [ "$IS_LTS" = "true" ]; then
            TAG_LIST="${TAG_LIST},${REPO}:lts"
          fi

          SCAN_TAG="local/${{ inputs.image }}:${UPSTREAM}"

          echo "tags=$TAG_LIST" >> "$GITHUB_OUTPUT"
          echo "scan-tag=$SCAN_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and Load Local Image (amd64)
        if: inputs.enable-trivy || inputs.enable-sbom
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: |
              VERSION=${{ matrix.version.upstream }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.tags.outputs.scan-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner (SARIF)
        if: inputs.enable-trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.scan-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security Tab
        if: inputs.enable-trivy && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-${{ inputs.image }}-${{ matrix.version.upstream }}'

      - name: Run Trivy Vulnerability Scanner (Table)
        if: inputs.enable-trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.scan-tag }}
          format: 'table'
          output: 'trivy-table.txt'
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          exit-code: '0'
          skip-setup-trivy: true

      - name: Generate SBOM
        if: inputs.enable-sbom
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.scan-tag }}
          format: ${{ inputs.sbom-format }}
          output: 'sbom-${{ matrix.version.upstream }}.json'
          skip-setup-trivy: true

      - name: Upload SBOM Artifact
        if: inputs.enable-sbom
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.image }}-${{ matrix.version.upstream }}
          path: 'sbom-${{ matrix.version.upstream }}.json'
          if-no-files-found: warn

      - name: Publish Security & SBOM Summary
        if: (inputs.enable-trivy || inputs.enable-sbom) && always()
        run: |
          if [ -f trivy-table.txt ] && [ -s trivy-table.txt ]; then
            {
              echo "### 🛡️ Trivy Vulnerability Scan: \`${{ inputs.image }}:${{ matrix.version.upstream }}\`"
              echo "**Severity filter:** \`${{ inputs.trivy-severity }}\` | **Ignore unfixed:** \`${{ inputs.trivy-ignore-unfixed }}\`"
              echo ""
              echo "<details><summary>Click to view vulnerability findings</summary>"
              echo ""
              echo '```text'
              cat trivy-table.txt
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f "sbom-${{ matrix.version.upstream }}.json" ]; then
            {
              echo ""
              echo "📦 **SBOM Generated:** \`sbom-${{ matrix.version.upstream }}.json\` (Format: \`${{ inputs.sbom-format }}\`)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: |
              VERSION=${{ matrix.version.upstream }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name != 'pull_request' && !inputs.dry-run }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
