name: Ruff

on:
  workflow_call:
    inputs:
      version:
        description: 'The version of Ruff to install'
        required: false
        type: string
        default: ''
      args:
        description: 'The arguments to pass to the ruff command'
        required: false
        type: string
        default: 'check'

permissions:
  contents: read

jobs:
  ruff:
    name: Run Ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          version: ${{ inputs.version }}
          args: ${{ inputs.args }}
