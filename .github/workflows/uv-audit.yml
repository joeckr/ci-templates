name: UV Audit

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory for the uv audit'
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  uv-audit:
    name: Run uv audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          working-directory: ${{ inputs.working-directory }}

      - name: Run uv audit
        working-directory: ${{ inputs.working-directory }}
        run: uv audit
