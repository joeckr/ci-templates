name: UV Audit

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory for the uv audit'
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  uv-audit:
    name: Run uv audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          working-directory: ${{ inputs.working-directory }}

      - name: Run uv audit
        working-directory: ${{ inputs.working-directory }}
        run: uv audit
