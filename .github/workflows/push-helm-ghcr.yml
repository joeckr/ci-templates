name: Reusable Helm Chart Packaging and Push to GHCR

on:
  workflow_call:
    inputs:
      chart-path:
        description: 'Path to a single chart directory (e.g. charts/my-chart). If provided, charts-dir is ignored'
        required: false
        type: string
        default: ''
      charts-dir:
        description: 'Directory containing helm charts relative to repository root'
        required: false
        type: string
        default: 'chart'
      registry:
        description: 'Container registry to push to'
        required: false
        type: string
        default: 'ghcr.io'
      org:
        description: 'Organization or user owning the registry namespace'
        required: false
        type: string
        default: ${{ github.repository_owner }}
      subpath:
        description: 'Optional subpath under registry namespace (e.g. charts)'
        required: false
        type: string
        default: 'charts'
      helm-version:
        description: 'Helm version to install (e.g. latest, v3.15.0)'
        required: false
        type: string
        default: 'latest'
      helm-repos:
        description: 'Optional newline-separated list of Helm repositories to add before dependency build (e.g. "longhorn https://charts.longhorn.io" or "longhorn=https://charts.longhorn.io")'
        required: false
        type: string
        default: ''
      version:
        description: 'Optional version override for chart packaging'
        required: false
        type: string
        default: ''
      app-version:
        description: 'Optional appVersion override for chart packaging'
        required: false
        type: string
        default: ''
      dependency-update:
        description: 'Run helm dependency build prior to packaging'
        required: false
        type: boolean
        default: true
      lint:
        description: 'Run helm lint prior to packaging'
        required: false
        type: boolean
        default: true
      dry-run:
        description: 'Package and lint charts but do not push to registry'
        required: false
        type: boolean
        default: false
    secrets:
      github-token:
        description: 'Token for authenticating with the registry (defaults to GITHUB_TOKEN)'
        required: false
    outputs:
      packages:
        description: 'JSON array of packaged chart files'
        value: ${{ jobs.publish.outputs.packages }}

permissions:
  contents: read

jobs:
  publish:
    name: Package & Publish Helm Charts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to publish OCI Helm charts to GitHub Packages (GHCR)
    outputs:
      packages: ${{ steps.package.outputs.packages }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: ${{ inputs.helm-version }}

      - name: Log in to Registry
        if: ${{ !inputs.dry-run && github.event_name != 'pull_request' }}
        env:
          REGISTRY: ${{ inputs.registry }}
          ACTOR: ${{ github.actor }}
          INPUT_TOKEN: ${{ secrets.github-token }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN="${INPUT_TOKEN:-$GITHUB_TOKEN_FALLBACK}"
          echo "$TOKEN" | helm registry login "$REGISTRY" --username "$ACTOR" --password-stdin

      - name: Add Helm Repositories
        if: ${{ inputs.helm-repos != '' }}
        env:
          HELM_REPOS: ${{ inputs.helm-repos }}
        run: |
          echo "::group::Adding Helm Repositories"
          while IFS= read -r line || [ -n "$line" ]; do
            # Trim leading/trailing whitespace
            line=$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [ -z "$line" ] && continue
            [[ "$line" =~ ^# ]] && continue

            # Strip optional leading "helm repo add "
            line=$(echo "$line" | sed -E 's/^helm[[:space:]]+repo[[:space:]]+add[[:space:]]+//')

            # Normalize "name=url" or "name = url" to "name url"
            if [[ "$line" =~ ^([^[:space:]=]+)[[:space:]]*=[[:space:]]*(.*)$ ]]; then
              line="${BASH_REMATCH[1]} ${BASH_REMATCH[2]}"
            fi

            echo "Adding repository: $line"
            # shellcheck disable=SC2086
            helm repo add $line
          done <<< "$HELM_REPOS"

          echo "Updating Helm repositories..."
          helm repo update
          echo "::endgroup::"

      - name: Discover and Validate Charts
        id: discover
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          CHARTS_DIR: ${{ inputs.charts-dir }}
          DEPENDENCY_UPDATE: ${{ inputs.dependency-update }}
          LINT: ${{ inputs.lint }}
        run: |
          CHARTS=()

          if [ -n "$CHART_PATH" ]; then
            CLEAN_PATH=$(echo "$CHART_PATH" | tr -d '\r" ' | sed 's|^./||')
            if [ ! -f "$CLEAN_PATH/Chart.yaml" ]; then
              echo "ERROR: Chart.yaml not found at specified chart-path '$CLEAN_PATH'!"
              exit 1
            fi
            CHARTS+=("$CLEAN_PATH")
          else
            CLEAN_DIR=$(echo "$CHARTS_DIR" | tr -d '\r" ' | sed 's|^./||')
            if [ ! -d "$CLEAN_DIR" ]; then
              echo "ERROR: Specified charts-dir '$CLEAN_DIR' does not exist!"
              exit 1
            fi
            while IFS= read -r chart_file; do
              [ -n "$chart_file" ] && CHARTS+=("$(dirname "$chart_file")")
            done < <(find "$CLEAN_DIR" -name "Chart.yaml" -type f | sort)
          fi

          if [ ${#CHARTS[@]} -eq 0 ]; then
            echo "ERROR: No Helm charts found!"
            exit 1
          fi

          echo "Discovered charts:"
          for c in "${CHARTS[@]}"; do
            echo " - $c"
          done

          # Save charts list for subsequent steps
          printf "%s\n" "${CHARTS[@]}" > .discovered_charts.txt

          # Dependency update
          if [ "$DEPENDENCY_UPDATE" = "true" ]; then
            echo "::group::Building Chart Dependencies"
            for c in "${CHARTS[@]}"; do
              if [ -f "$c/Chart.lock" ] || grep -q '^dependencies:' "$c/Chart.yaml"; then
                echo "Updating dependencies for $c..."
                helm dependency build "$c"
              else
                echo "No dependencies declared for $c, skipping."
              fi
            done
            echo "::endgroup::"
          fi

          # Lint
          if [ "$LINT" = "true" ]; then
            echo "::group::Linting Charts"
            for c in "${CHARTS[@]}"; do
              echo "Linting $c..."
              helm lint "$c"
            done
            echo "::endgroup::"
          fi

      - name: Package Charts
        id: package
        env:
          VERSION: ${{ inputs.version }}
          APP_VERSION: ${{ inputs.app-version }}
        run: |
          mkdir -p .helm-packages

          PACKAGE_FLAGS=()
          if [ -n "$VERSION" ]; then
            PACKAGE_FLAGS+=(--version "$VERSION")
          fi
          if [ -n "$APP_VERSION" ]; then
            PACKAGE_FLAGS+=(--app-version "$APP_VERSION")
          fi

          echo "::group::Packaging Charts"
          while IFS= read -r chart; do
            [ -z "$chart" ] && continue
            echo "Packaging $chart..."
            helm package "$chart" --destination .helm-packages "${PACKAGE_FLAGS[@]}"
          done < .discovered_charts.txt
          echo "::endgroup::"

          PACKAGES_JSON=$(find .helm-packages -name "*.tgz" -exec basename {} \; | jq -R -s -c 'split("\n")[:-1]')
          echo "packages=$PACKAGES_JSON" >> "$GITHUB_OUTPUT"
          echo "Generated packages: $PACKAGES_JSON"

      - name: Push Charts to Registry
        id: push
        env:
          ORG: ${{ inputs.org }}
          REGISTRY: ${{ inputs.registry }}
          SUBPATH: ${{ inputs.subpath }}
          DRY_RUN: ${{ inputs.dry-run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # GHCR requires registry namespace/owner to be lowercase
          OWNER=$(echo "$ORG" | tr '[:upper:]' '[:lower:]')
          SUBPATH=$(echo "$SUBPATH" | sed 's|^/*||;s|/*$||')

          if [ -n "$SUBPATH" ]; then
            OCI_DEST="oci://${REGISTRY}/${OWNER}/${SUBPATH}"
          else
            OCI_DEST="oci://${REGISTRY}/${OWNER}"
          fi

          SHOULD_PUSH="true"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled. Skipping push to registry."
            SHOULD_PUSH="false"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Pull request trigger detected. Skipping push to registry."
            SHOULD_PUSH="false"
          fi

          echo "Target OCI repository destination: $OCI_DEST"
          echo "::group::Pushing Packages"
          for pkg in .helm-packages/*.tgz; do
            [ -e "$pkg" ] || continue
            PKG_NAME=$(basename "$pkg")
            if [ "$SHOULD_PUSH" = "true" ]; then
              echo "Pushing $PKG_NAME to $OCI_DEST..."
              helm push "$pkg" "$OCI_DEST"
            else
              echo "[DRY-RUN] Would push $PKG_NAME to $OCI_DEST"
            fi
          done
          echo "::endgroup::"

      - name: Generate Summary
        if: always()
        env:
          ORG: ${{ inputs.org }}
          REGISTRY: ${{ inputs.registry }}
          SUBPATH: ${{ inputs.subpath }}
          DRY_RUN: ${{ inputs.dry-run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          OWNER=$(echo "$ORG" | tr '[:upper:]' '[:lower:]')
          SUBPATH=$(echo "$SUBPATH" | sed 's|^/*||;s|/*$||')

          if [ -n "$SUBPATH" ]; then
            OCI_DEST="oci://${REGISTRY}/${OWNER}/${SUBPATH}"
          else
            OCI_DEST="oci://${REGISTRY}/${OWNER}"
          fi

          STATUS="Pushed"
          if [ "$DRY_RUN" = "true" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            STATUS="Dry Run (Not Pushed)"
          fi

          {
            echo "## 📦 Helm Charts Build Summary"
            echo ""
            echo "| Package | Status | Destination |"
            echo "| --- | --- | --- |"
            for pkg in .helm-packages/*.tgz; do
              if [ -e "$pkg" ]; then
                echo "| \`$(basename "$pkg")\` | $STATUS | \`${OCI_DEST}\` |"
              fi
            done
            echo ""
            echo "- **Registry**: \`${REGISTRY}\`"
            echo "- **Owner/Org**: \`${OWNER}\`"
            echo "- **Dry Run**: \`${DRY_RUN}\`"
          } >> "$GITHUB_STEP_SUMMARY"
