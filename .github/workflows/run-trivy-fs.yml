name: Trivy FS Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  trivy:
    permissions:
      contents: read
      security-events: write
    uses: $/.github/workflows/trivy-fs.yml
