name: Hadolint

on:
  workflow_call:
    inputs:
      dockerfile:
        description: 'Path to the Dockerfile to lint'
        required: false
        type: string
        default: 'Dockerfile'
      recursive:
        description: 'Lint all Dockerfiles in the repository recursively'
        required: false
        type: boolean
        default: false
      failure-threshold:
        description: 'Fail the pipeline when issues of this severity or higher are found (error, warning, info, style)'
        required: false
        type: string
        default: 'info'
      config:
        description: 'Path to a custom hadolint config file'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  hadolint:
    name: Run Hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ inputs.dockerfile }}
          recursive: ${{ inputs.recursive }}
          failure-threshold: ${{ inputs.failure-threshold }}
          config: ${{ inputs.config }}
