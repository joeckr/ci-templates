name: Hadolint

on:
  workflow_call:
    inputs:
      dockerfile:
        description: 'Path to the Dockerfile to lint'
        required: false
        type: string
        default: 'Dockerfile'
      recursive:
        description: 'Lint all Dockerfiles in the repository recursively'
        required: false
        type: boolean
        default: false
      failure-threshold:
        description: 'Fail the pipeline when issues of this severity or higher are found (error, warning, info, style)'
        required: false
        type: string
        default: 'info'
      config:
        description: 'Path to a custom hadolint config file'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  hadolint:
    name: Run Hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: ${{ inputs.dockerfile }}
          recursive: ${{ inputs.recursive }}
          failure-threshold: ${{ inputs.failure-threshold }}
          config: ${{ inputs.config }}
