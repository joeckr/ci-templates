name: Reusable Container Build

on:
  workflow_call:
    inputs:
      image:
        description: 'Name of the image to build'
        required: true
        type: string
      version:
        description: 'Version tag for the image'
        required: true
        type: string
      org:
        description: 'Name of the org/individual to build'
        required: false
        type: string
        default: ${{ github.repository_owner }}
      context:
        description: 'Build context'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile relative to context'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Platforms to build for'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      registry:
        description: 'Container registry to push to'
        required: false
        type: string
        default: 'ghcr.io'
      dry-run:
        description: 'To test if images build on PR but DO NOT push'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Tags and Labels
        id: meta
        env:
          REGISTRY: ${{ inputs.registry }}
          ORG: ${{ inputs.org }}
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          REPO="${REGISTRY}/${ORG}/${IMAGE}"
          TAG_LIST="${REPO}:${VERSION},${REPO}:latest"
          echo "tags=$TAG_LIST" >> "$GITHUB_OUTPUT"

          DOCKERFILE_PATH="${CONTEXT%/}/${DOCKERFILE#./}"
          BASE_IMAGE=""
          if [ -f "$DOCKERFILE_PATH" ]; then
            BASE_IMAGE=$(awk 'toupper($1) == "FROM" {
              for (i = 2; i <= NF; i++) {
                if ($i ~ /^--/) continue
                img = $i
                break
              }
            } END { print img }' "$DOCKERFILE_PATH")
          fi

          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=${SERVER_URL}/${REPOSITORY}"
            echo "org.opencontainers.image.version=${VERSION}"
            echo "org.opencontainers.image.revision=${SHA}"
            if [ -n "$BASE_IMAGE" ]; then
              echo "org.opencontainers.image.base.name=${BASE_IMAGE}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name != 'pull_request' && !inputs.dry-run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
