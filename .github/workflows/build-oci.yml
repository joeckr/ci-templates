name: Reusable Container Build

on:
  workflow_call:
    inputs:
      image:
        description: 'Name of the image to build'
        required: true
        type: string
      version:
        description: 'Version tag for the image'
        required: true
        type: string
      org:
        description: 'Name of the org/individual to build'
        required: false
        type: string
        default: ${{ github.actor }}
      context:
        description: 'Build context'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile relative to context'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Platforms to build for'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      registry:
        description: 'Container registry to push to'
        required: false
        type: string
        default: 'ghcr.io'
      dry-run:
        description: 'To test if images build on PR but DO NOT push'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Tags
        id: tags
        env:
          REGISTRY: ${{ inputs.registry }}
          ORG: ${{ inputs.org }}
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          REPO="${REGISTRY}/${ORG}/${IMAGE}"
          TAG_LIST="${REPO}:${VERSION},${REPO}:latest"

          echo "tags=$TAG_LIST" >> "$GITHUB_OUTPUT"

      - name: Build & Push Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name != 'pull_request' && !inputs.dry-run }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
