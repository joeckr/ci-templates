name: Reusable Container Build

on:
  workflow_call:
    inputs:
      image:
        description: 'Name of the image to build'
        required: true
        type: string
      version:
        description: 'Version tag for the image'
        required: true
        type: string
      org:
        description: 'Name of the org/individual to build'
        required: false
        type: string
        default: ${{ github.repository_owner }}
      context:
        description: 'Build context'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile relative to context'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Platforms to build for'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      registry:
        description: 'Container registry to push to'
        required: false
        type: string
        default: 'ghcr.io'
      attest:
        description: 'Generate keyless SLSA build provenance attestation for pushed images'
        required: false
        type: boolean
        default: true
      dry-run:
        description: 'To test if images build on PR but DO NOT push'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to Registry
        if: github.event_name != 'pull_request' && !inputs.dry-run
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Tags and Labels
        id: meta
        env:
          REGISTRY: ${{ inputs.registry }}
          ORG: ${{ inputs.org }}
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          OWNER=$(echo "$ORG" | tr '[:upper:]' '[:lower:]')
          REPO="${REGISTRY}/${OWNER}/${IMAGE}"
          TAG_LIST="${REPO}:${VERSION},${REPO}:latest"
          {
            echo "repo=$REPO"
            echo "tags=$TAG_LIST"
          } >> "$GITHUB_OUTPUT"

          DOCKERFILE_PATH="${CONTEXT%/}/${DOCKERFILE#./}"
          BASE_IMAGE=""
          if [ -f "$DOCKERFILE_PATH" ]; then
            BASE_IMAGE=$(awk 'toupper($1) == "FROM" {
              for (i = 2; i <= NF; i++) {
                if ($i ~ /^--/) continue
                img = $i
                break
              }
            } END { print img }' "$DOCKERFILE_PATH")
          fi

          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=${SERVER_URL}/${REPOSITORY}"
            echo "org.opencontainers.image.version=${VERSION}"
            echo "org.opencontainers.image.revision=${SHA}"
            if [ -n "$BASE_IMAGE" ]; then
              echo "org.opencontainers.image.base.name=${BASE_IMAGE}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name != 'pull_request' && !inputs.dry-run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest Build Provenance
        if: github.event_name != 'pull_request' && !inputs.dry-run && inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
