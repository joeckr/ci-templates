name: Reusable Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      allow-patch:
        description: 'Auto-merge Dependabot semver-patch PRs once required checks pass'
        required: false
        type: boolean
        default: true
      allow-ci:
        description: 'Auto-merge Dependabot GitHub Actions (ci) PRs once required checks pass'
        required: false
        type: boolean
        default: true
      merge-method:
        description: 'Merge method: merge, squash, or rebase'
        required: false
        type: string
        default: 'merge'

permissions:
  contents: read

jobs:
  auto-merge:
    name: Dependabot Auto-Merge
    if: github.event_name == 'pull_request' && github.event.pull_request.user.id == 49699333
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot Metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0

      - name: Enable Auto-Merge for Low-Risk Updates
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ALLOW_PATCH: ${{ inputs.allow-patch }}
          ALLOW_CI: ${{ inputs.allow-ci }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$MERGE_METHOD" in
            merge|squash|rebase) ;;
            *)
              echo "ERROR: Invalid merge-method '$MERGE_METHOD'. Expected merge, squash, or rebase."
              exit 1
              ;;
          esac

          SHOULD_MERGE="false"
          if [ "$ALLOW_PATCH" = "true" ] && [ "$UPDATE_TYPE" = "version-update:semver-patch" ]; then
            SHOULD_MERGE="true"
          elif [ "$ALLOW_CI" = "true" ] && [ "$PACKAGE_ECOSYSTEM" = "github-actions" ]; then
            SHOULD_MERGE="true"
          fi

          if [ "$SHOULD_MERGE" = "true" ]; then
            echo "Enabling auto-merge (--${MERGE_METHOD}) for ${PACKAGE_ECOSYSTEM} (${UPDATE_TYPE})..."
            gh pr merge --auto "--${MERGE_METHOD}" "$PR_URL"
          else
            echo "Manual review required for ${PACKAGE_ECOSYSTEM} (${UPDATE_TYPE}). Skipping auto-merge."
          fi
