name: Commitlint

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read  # required to fetch PR metadata

jobs:
  commitlint:
    name: Lint Commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # required to fetch PR metadata
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Fallback Commitlint Config
        id: config
        run: |
          if [ ! -f "commitlint.config.mjs" ] && \
             [ ! -f "commitlint.config.js" ] && \
             [ ! -f "commitlint.config.cjs" ] && \
             [ ! -f "commitlint.config.ts" ]; then
            cat << 'EOF' > .commitlint.fallback.mjs
          export default {
            extends: ['@commitlint/config-conventional'],
            rules: {
              'body-max-line-length': [0, 'always'],
              'footer-max-line-length': [0, 'always'],
              'header-max-length': [0, 'always']
            }
          };
          EOF
            echo "CONFIG_FILE=.commitlint.fallback.mjs" >> "$GITHUB_ENV"
          else
            echo "CONFIG_FILE=" >> "$GITHUB_ENV"
          fi

      - name: Run Commitlint
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed  # v6
        with:
          configFile: ${{ env.CONFIG_FILE }}
