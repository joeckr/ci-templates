name: Reusable Matrix Container Build for custom Images

on:
  workflow_call:
    inputs:
      versions-file:
        description: 'Path to versions.json relative to repo root'
        required: false
        type: string
        default: 'versions.json'
      image:
        description: 'Name of the image to build'
        required: true
        type: string
      org:
        description: 'Name of the org/individual to build'
        required: false
        type: string
        default: ${{ github.repository_owner }}
      context:
        description: 'Build context'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile relative to context'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Platforms to build for'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      registry:
        description: 'Container registry to push to'
        required: false
        type: string
        default: 'ghcr.io'
      dry-run:
        description: 'To test if images build on PR but DO NOT push'
        required: false
        type: boolean
        default: false
      enable-trivy:
        description: 'Run Trivy vulnerability scanner'
        required: false
        type: boolean
        default: true
      enable-sbom:
        description: 'Generate and upload an SBOM artifact'
        required: false
        type: boolean
        default: true
      trivy-severity:
        description: 'Vulnerability severities to scan for (comma-separated)'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      trivy-ignore-unfixed:
        description: 'Ignore vulnerabilities without an available fix'
        required: false
        type: boolean
        default: false
      sbom-format:
        description: 'SBOM output format (cyclonedx or spdx-json)'
        required: false
        type: string
        default: 'cyclonedx'

permissions:
  contents: read

jobs:
  matrix-setup:
    name: Generate Version Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Parse Matrix Config
        id: set-matrix
        env:
          VERSIONS_FILE: ${{ inputs.versions-file }}
        run: |
            FILE_NAME=$(echo "$VERSIONS_FILE" | tr -d '\r" ' | sed 's|^./||')

            echo "Parsing $FILE_NAME..."

            # Read JSON content directly with jq
            MATRIX_JSON=$(jq -c . "$FILE_NAME")

            if [ -z "$MATRIX_JSON" ]; then
              echo "ERROR: Failed to parse $FILE_NAME or file is empty!"
              exit 1
            fi

            echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: matrix-setup
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
    permissions:
      contents: read
      packages: write  # required to push OCI container images to registry
      security-events: write  # required to upload Trivy SARIF scan results
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Tag
        id: tags
        env:
          VERSION: ${{ matrix.version.version }}
          BASE: ${{ matrix.version.base-image }}
          TAG: ${{ matrix.version.base-tag }}
          IS_LATEST: ${{ matrix.version.latest }}
          IS_LTS: ${{ matrix.version.lts }}
          REGISTRY: ${{ inputs.registry }}
          ORG: ${{ inputs.org }}
          IMAGE: ${{ inputs.image }}
        run: |
          REPO="${REGISTRY}/${ORG}/${IMAGE}"

          if [ -z "$VERSION" ]; then
            echo "ERROR: matrix.version.version is not set"
            exit 1
          fi

          TAG_LIST="${REPO}:${VERSION}"

          if [ "$IS_LATEST" = "true" ]; then
            TAG_LIST="${TAG_LIST},${REPO}:latest"
          fi

          if [ "$IS_LTS" = "true" ]; then
            TAG_LIST="${TAG_LIST},${REPO}:lts"
          fi

          SCAN_TAG="local/${IMAGE}:${VERSION}"

          echo "tags=$TAG_LIST" >> "$GITHUB_OUTPUT"
          echo "scan-tag=$SCAN_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and Load Local Image (amd64)
        if: inputs.enable-trivy || inputs.enable-sbom
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: |
              VERSION=${{ matrix.version.version }}
              IMAGE=${{ matrix.version.base-image }}
              TAG=${{ matrix.version.base-tag }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.tags.outputs.scan-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner (SARIF)
        if: inputs.enable-trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.scan-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security Tab
        if: inputs.enable-trivy && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca  # v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-${{ inputs.image }}-${{ matrix.version.version }}'

      - name: Run Trivy Vulnerability Scanner (Table)
        if: inputs.enable-trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.scan-tag }}
          format: 'table'
          output: 'trivy-table.txt'
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          exit-code: '0'
          skip-setup-trivy: true

      - name: Generate SBOM
        if: inputs.enable-sbom
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.scan-tag }}
          format: ${{ inputs.sbom-format }}
          output: 'sbom-${{ matrix.version.version }}.json'
          skip-setup-trivy: true

      - name: Upload SBOM Artifact
        if: inputs.enable-sbom
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-${{ inputs.image }}-${{ matrix.version.version }}
          path: 'sbom-${{ matrix.version.version }}.json'
          if-no-files-found: warn

      - name: Publish Security & SBOM Summary
        if: (inputs.enable-trivy || inputs.enable-sbom) && always()
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ matrix.version.version }}
          TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
          TRIVY_IGNORE_UNFIXED: ${{ inputs.trivy-ignore-unfixed }}
          SBOM_FORMAT: ${{ inputs.sbom-format }}
        run: |
          if [ -f trivy-table.txt ] && [ -s trivy-table.txt ]; then
            {
              echo "### 🛡️ Trivy Vulnerability Scan: \`${IMAGE}:${VERSION}\`"
              echo "**Severity filter:** \`${TRIVY_SEVERITY}\` | **Ignore unfixed:** \`${TRIVY_IGNORE_UNFIXED}\`"
              echo ""
              echo "<details><summary>Click to view vulnerability findings</summary>"
              echo ""
              echo '```text'
              cat trivy-table.txt
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f "sbom-${VERSION}.json" ]; then
            {
              echo ""
              echo "📦 **SBOM Generated:** \`sbom-${VERSION}.json\` (Format: \`${SBOM_FORMAT}\`)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build & Push Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: |
              VERSION=${{ matrix.version.version }}
              IMAGE=${{ matrix.version.base-image }}
              TAG=${{ matrix.version.base-tag }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name != 'pull_request' && !inputs.dry-run }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
